[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcenn-qml"
version = "0.3.0"
description = "Quantum memory inference, matched denoising, and reversible softmax attention"
license = "LicenseRef-QCeNN-QML-NC-Commercial"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "qiskit>=1.2,<3", "qiskit-aer>=0.15,<1", "pillow>=10"]

[project.optional-dependencies]
mnist = []
teacher = ["transformers>=4.45,<6", "torch>=2.2", "safetensors>=0.4"]
test = ["pytest>=8", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
