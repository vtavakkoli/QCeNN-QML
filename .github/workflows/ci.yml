name: Test quantum inference circuits
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Staged studies, scientific blocking and per-track archives (proxy diagnostics)
        env:
          QCENN_PYTHON: python
          QCENN_CPUS: '2'
          QCENN_JOBS: '2'
        run: |
          set +e
          bash scripts/run_research_studies.sh --smoke results/ci/studies
          qcenn_study_code=$?
          set -e
          case "$qcenn_study_code" in 0|2) ;; *) exit "$qcenn_study_code" ;; esac
          bash scripts/run_research_studies.sh --status results/ci/studies
          for archive in results/ci/studies/archives/*.zip; do unzip -t "$archive"; done
      - name: Parallel runner, gate status and per-experiment ZIPs (digits proxy)
        env:
          QCENN_PYTHON: python
          QCENN_CPUS: '2'
          QCENN_JOBS: '2'
        run: |
          set +e
          bash scripts/run_quantum_corrections.sh --smoke results/ci/parallel
          qcenn_code=$?
          set -e
          case "$qcenn_code" in 0|2) ;; *) exit "$qcenn_code" ;; esac
          bash scripts/run_quantum_corrections.sh --status results/ci/parallel
          for archive in results/ci/parallel/archives/*.zip; do unzip -t "$archive"; done
      - run: python -m qcenn_qml.mnist --dataset digits-proxy --classes 01 --train-per-class 1 --test-per-class 1 --shots 128 --iterations 0 --output-dir results/ci/mnist
      - name: Coherent text CLI smoke (small raw corpus)
        run: >-
          python -m qcenn_qml.smol135 --corpus-file tests/fixtures/quantum_sequence.txt
          --prompt cat --new-tokens 2 --shots 128 --output-dir results/ci/smol
      - name: Ten-class recurrent CLI smoke (digits proxy, not MNIST)
        run: >-
          python -m qcenn_qml.recurrent_mnist --dataset digits-proxy --seeds 3
          --train-per-class 1 --validation-per-class 1 --test-per-class 1
          --side 4 --rounds 2 --shots 256
          --include-reset-control --output-dir results/ci/recurrent
      - uses: actions/upload-artifact@v4
        with:
          name: recurrent-digits-proxy-smoke
          path: results/ci/recurrent

      - name: Quantum diffusion toy and masked-noise benchmarks
        run: >-
          python -m qcenn_qml.diffusion.benchmark --shots 256 --examples 4
          --beta 1 --eta 0.65 --steps 0 1 3 --corpus-kind toy --readout-error 0
          --output-dir results/ci/diffusion
      - name: Broader held-out text with matched readout noise
        run: >-
          python -m qcenn_qml.diffusion.benchmark --shots 128 --examples 2
          --beta 1 --eta 0.65 --steps 0 1 3
          --corpus-kind text --readout-error 0.05 --output-dir results/ci/diffusion-noisy
      - name: Reversible signed quantum softmax attention
        run: python -m qcenn_qml.quantum_attention --shots 2048 --output-dir results/ci/attention
      - name: Explicit full-Smol coverage and resource audit
        run: python -m qcenn_qml.smol_feasibility --attention-report results/ci/attention/report.json --output-dir results/ci/smol-audit
      - name: Combined quantum research audit
        run: >-
          python -m qcenn_qml.report --diffusion-noisy results/ci/diffusion-noisy/report.json
          --recurrent results/ci/recurrent/report.json --attention results/ci/attention/report.json
          --smol-feasibility results/ci/smol-audit/report.json --output-dir results/ci/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcenn-qml-all-simulator-results
          path: results/ci/
          if-no-files-found: warn
