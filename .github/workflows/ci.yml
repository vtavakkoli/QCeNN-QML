name: Test quantum inference circuits
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m qcenn_qml.mnist --dataset digits-proxy --classes 01 --train-per-class 1 --test-per-class 1 --shots 128 --iterations 0 --output-dir results/ci/mnist
      - run: python -m qcenn_qml.smol135 --new-tokens 2 --shots 512 --output-dir results/ci/smol
      - name: Ten-class recurrent CLI smoke (digits proxy, not MNIST)
        run: >-
          python -m qcenn_qml.recurrent_mnist --dataset digits-proxy --seeds 3 4
          --train-per-class 1 --validation-per-class 1 --test-per-class 1
          --exemplars-per-class 1 --side 4 --training-steps 1 --shots 64
          --skip-quantum-overlap --include-reset-control --output-dir results/ci/recurrent
      - uses: actions/upload-artifact@v4
        with:
          name: recurrent-digits-proxy-smoke
          path: results/ci/recurrent

      - name: Quantum diffusion toy and masked-noise benchmarks
        run: >-
          python -m qcenn_qml.diffusion.benchmark --shots 256 --examples 4
          --beta 1 --eta 0.65 --steps 0 1 3
          --output-dir results/ci/diffusion
      - name: Quantum diffusion with readout bit-flip noise
        run: >-
          python -m qcenn_qml.diffusion.benchmark --shots 256 --examples 4
          --beta 1 --eta 0.65 --steps 0 1 3
          --readout-error 0.05 --output-dir results/ci/diffusion-noisy
      - name: Combined quantum research audit
        run: python -m qcenn_qml.report --diffusion-noisy results/ci/diffusion-noisy/report.json --output-dir results/ci/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcenn-qml-all-simulator-results
          path: results/ci/
          if-no-files-found: warn
